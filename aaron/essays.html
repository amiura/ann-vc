<style>

.badge.st-none{background:#2a313d;color:var(--mut)}

.badge.st-finished{background:#13402c;color:var(--good)}

/* auth modal */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center}

<script>
// Password auth
const AUTH_HASH = '346ecd6ee37bc648468530e4eb4a839f7edbc7a6209b717a517061f785b37b15';
async function hashPass(pass) {
    const data = new TextEncoder().encode(pass);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function unlock() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('main-content').classList.remove('content-hidden');
}
if (sessionStorage.getItem('aaron-auth') === 'true') { unlock(); }
document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = document.getElementById('auth-pass').value;
    const hash = await hashPass(pass);
    if (hash === AUTH_HASH) {
        sessionStorage.setItem('aaron-auth', 'true');
        unlock();
    } else {
        document.getElementById('auth-error').style.display = 'block';
    }
});

// Load saved status from localStorage
function loadSavedStatus() {
  const saved = localStorage.getItem('aaron-essay-status');
  if (saved) {
    const statuses = JSON.parse(saved);
    for (const school in essaysData) {
      for (const essay of essaysData[school].essays) {
        if (statuses[essay.id]) {
          essay.status = statuses[essay.id];
        }
      }
    }
  }
}

// Save status to localStorage
function saveStatus() {
  const statuses = {};
  for (const school in essaysData) {
    for (const essay of essaysData[school].essays) {
      statuses[essay.id] = essay.status;
    }
  }
  localStorage.setItem('aaron-essay-status', JSON.stringify(statuses));
}

// Cycle status: none → drafting → finished → drafting
function cycleStatus(essayId) {
  for (const school in essaysData) {
    for (const essay of essaysData[school].essays) {
      if (essay.id === essayId && essay.status !== 'na') {
        if (essay.status === 'none') essay.status = 'drafting';
        else if (essay.status === 'drafting') essay.status = 'finished';
        else if (essay.status === 'finished') essay.status = 'drafting';
        saveStatus();
        renderCards();
        return;
      }
    }
  }
}

// Get badge HTML
function getBadgeHtml(status, essayId) {
  const labels = { none: 'Not started', drafting: 'Drafting', finished: 'Finished', na: 'N/A' };
  const classes = { none: 'st-none', drafting: 'st-drafting', finished: 'st-finished', na: 'st-na' };
  return `<span class="badge ${classes[status]}" data-essay="${essayId}">${labels[status]}</span>`;
}

// Count essays
function countEssays() {
  let total = 0, done = 0;
  for (const school in essaysData) {
    for (const essay of essaysData[school].essays) {
      if (essay.status !== 'na') {
        total++;
        if (essay.status === 'finished') done++;
      }
    }
  }
  return { total, done };
}

// Update summary
function updateSummary() {
  const { total, done } = countEssays();
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = total;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('pct-bar').style.width = pct + '%';
}

// Render school cards
function renderCards() {
  const grid = document.getElementById('essays-grid');
  grid.innerHTML = '';

  for (const school in essaysData) {
    const data = essaysData[school];
    const card = document.createElement('div');
    card.className = 'scard';

    // Count status for this school
    const schoolEssays = data.essays.filter(e => e.status !== 'na');
    const finishedCount = schoolEssays.filter(e => e.status === 'finished').length;
    const draftingCount = schoolEssays.filter(e => e.status === 'drafting').length;

    let statusText = '';
    if (schoolEssays.length === 0) {
      statusText = 'No essays required';
    } else if (finishedCount === schoolEssays.length) {
      statusText = 'All complete!';
    } else {
      statusText = `${finishedCount}/${schoolEssays.length} complete`;
      if (draftingCount > 0) statusText += ` · ${draftingCount} drafting`;
    }

    let essaysList = data.essays.map(e =>
      `<li><span class="eprompt">${e.prompt}</span>${getBadgeHtml(e.status, e.id)}</li>`
    ).join('');

    card.innerHTML = `
      <div class="scard-header">
        <span class="scard-name">${school}</span>
        <span class="scard-deadline">${data.deadline}</span>
      </div>
      <ul class="scard-essays">${essaysList}</ul>
      <div class="scard-footer">
        ${data.googleDocUrl ? `<a href="${data.googleDocUrl}" target="_blank" class="doc-link" onclick="event.stopPropagation()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Open Doc
        </a>` : '<span class="doc-link" style="opacity:0.5">No doc needed</span>'}
        <span class="scard-status">${statusText}</span>
      </div>
    `;

    // Click card to open doc and set drafting
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('badge') || e.target.closest('.doc-link')) return;
      if (data.googleDocUrl) {
        // Set any "none" essays to "drafting"
        let changed = false;
        for (const essay of data.essays) {
          if (essay.status === 'none') {
            essay.status = 'drafting';
            changed = true;
          }
        }
        if (changed) {
          saveStatus();
          renderCards();
        }
        window.open(data.googleDocUrl, '_blank');
      }
    });

    grid.appendChild(card);
  }

  // Add click handlers for badges
  document.querySelectorAll('.badge:not(.st-na)').forEach(badge => {
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      cycleStatus(badge.dataset.essay);
    });
  });

  updateSummary();
}

// Initialize
loadSavedStatus();
renderCards();

// confetti
const cv=document.getElementById('cfx'),cx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',size);size();
const COL=['#6ea8fe','#3ecf8e','#e0b341','#ef6f6f','#fff'];
function burst(x,y,n){for(let i=0;i<n;i++){P.push({x,y,vx:(Math.random()-.5)*9,vy:Math.random()*-9-3,
g:.28,s:Math.random()*5+3,c:COL[i%COL.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:90})}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.life-->0);
for(const p of P){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.life/90);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()}
if(P.length)requestAnimationFrame(tick)}
function celebrate(x,y){burst(x,y,40);requestAnimationFrame(tick)}
</script></body></html>
